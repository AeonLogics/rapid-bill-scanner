[package]
name = "win-ops"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
primitives = { path = "../primitives" }
gpui = { git = "https://github.com/zed-industries/zed" }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
]

[dependencies.tokio]
version = "1.53.1"
features = ["sync", "rt"]
